# DigitalOcean App Platform spec for Tiny Trauma.
#
# Editing this file:
#   1. Change anything you want here (instance size, env vars, health
#      check, etc.) and push to `main`.
#   2. `.github/workflows/do-spec-sync.yml` fetches the live spec,
#      splices the existing `EV[1:...]` SECRET ciphertexts into the
#      repo spec via `scripts/do-spec-merge.mjs`, then applies the
#      result with `doctl apps update`. Code pushes also trigger an
#      auto-deploy via `github.deploy_on_push`.
#
# Bootstrap (first deploy):
#   doctl apps create --spec .do/app.yaml
#
# Manual re-sync from your laptop (skips the GH Action — only do this
# if the action is broken or the repo is dirty):
#   doctl apps spec get <APP_ID> > /tmp/live.yaml
#   node scripts/do-spec-merge.mjs .do/app.yaml /tmp/live.yaml > /tmp/merged.yaml
#   doctl apps update <APP_ID> --spec /tmp/merged.yaml
#
# Required GitHub repo secrets (already set):
#   DIGITALOCEAN_ACCESS_TOKEN  - DO API token, scope `apps:write`
#   DO_APP_ID                  - 00052d67-e71e-46ae-ac96-faedbdffd3fd

name: tiny-trauma
region: blr

# App-level env vars are inherited by every component (web service +
# migrate job), so we only define DATABASE_URL once. Per-component
# overrides still work if needed later.
envs:
  - key: DATABASE_URL
    type: SECRET
    scope: RUN_TIME

domains:
  - domain: tinytrauma.com
    type: PRIMARY
    zone: tinytrauma.com

services:
  - name: web
    github:
      repo: amit-t/tiny-trauma-v2
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 3000
    build_command: pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start
    health_check:
      http_path: /
      # Cold-start the Next standalone server cold-loads its bundle,
      # opens the postgres pool, and pre-renders the home page on
      # first request. A 30s initial delay + 9 × 30s grace is enough
      # for the slowest cold path we've measured (~3.5 min) without
      # waiting forever on a truly stuck deploy.
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 9
    envs:
      # Build-time only: t3-env's escape hatch so `next build` doesn't
      # require real secrets while collecting page data. Runtime calls
      # still validate via lib/env.ts at first access.
      - key: SKIP_ENV_VALIDATION
        value: "1"
        scope: BUILD_TIME

      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME

      # DATABASE_URL is defined at the app level (see top of file) so the
      # web service and the migrate job share one SECRET. It points at
      # the standalone `tt-pg` cluster — the `databases:` binding block
      # is removed because DO Apps couldn't discover the cluster across
      # projects (`dbaas instance not found`), and reassigning it was
      # rejected by the DBaaS API (`service_down`). Pasting the
      # connection string directly sidesteps the whole binding system.

      - key: BETTER_AUTH_URL
        value: https://tinytrauma.com
        scope: RUN_TIME
      - key: BETTER_AUTH_SECRET
        type: SECRET
        scope: RUN_TIME

      - key: RESEND_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: RESEND_FROM
        value: hi@tinytrauma.com
        scope: RUN_TIME
      - key: RESEND_REPLY_TO
        value: hi@tinytrauma.com
        scope: RUN_TIME
      - key: RESEND_WEBHOOK_SECRET
        type: SECRET
        scope: RUN_TIME

      - key: CRON_SECRET
        type: SECRET
        scope: RUN_TIME

      - key: OWNER_EMAIL
        value: tiwari.m.amit@gmail.com
        scope: RUN_TIME

      - key: PLAUSIBLE_DOMAIN
        value: tinytrauma.com
        scope: RUN_TIME

jobs:
  # Runs `drizzle-kit migrate` against the managed DB before each new
  # release goes live. If migration fails, the deploy is aborted.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: amit-t/tiny-trauma-v2
      branch: main
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    build_command: pnpm install --frozen-lockfile
    # We don't use `drizzle-kit migrate` here because its spinner
    # swallows postgres-js connection errors. Our own runner prints the
    # error stack on failure so deploy-log post-mortems are possible.
    run_command: node scripts/migrate.mjs
    # DATABASE_URL is inherited from the app-level envs block at the
    # top of this file.

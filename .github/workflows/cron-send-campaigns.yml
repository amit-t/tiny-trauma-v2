name: cron-send-campaigns

# Pings /api/cron/send-campaigns every 15 minutes. The endpoint pulls
# `status = scheduled` rows whose scheduled_for is in the past, sends each
# to active subscribers in the campaign segment, and flips the row to `sent`.
#
# Repo secrets required:
#   CRON_SECRET   matches env.CRON_SECRET on the deployed app
#   SITE_URL      e.g. https://tinytrauma.in (no trailing slash)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-send-campaigns
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/send-campaigns
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$SITE_URL/api/cron/send-campaigns"

name: do-spec-sync

# Re-applies `.do/app.yaml` to the live DigitalOcean app whenever the spec
# changes on `main`. SECRET env values from the live spec are merged in
# first, so this action never blanks pasted secrets the way a naive
# `doctl apps update --spec .do/app.yaml` would.
#
# Required repo secrets:
#   DIGITALOCEAN_ACCESS_TOKEN - DO API token with apps:write
#   DO_APP_ID                 - the App Platform app ID (UUID)

on:
  push:
    branches: [main]
    paths:
      - ".do/app.yaml"
      - "scripts/do-spec-merge.mjs"
      - ".github/workflows/do-spec-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: do-spec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Fetch live spec
        run: doctl apps spec get "$APP_ID" > /tmp/live.yaml
        env:
          APP_ID: ${{ secrets.DO_APP_ID }}

      - name: Merge live SECRET ciphertexts into repo spec
        run: |
          set -euo pipefail
          node scripts/do-spec-merge.mjs .do/app.yaml /tmp/live.yaml > /tmp/merged.yaml
          # Sanity: confirm the merged spec parses.
          doctl apps spec validate /tmp/merged.yaml > /dev/null

      - name: Apply merged spec
        run: doctl apps update "$APP_ID" --spec /tmp/merged.yaml
        env:
          APP_ID: ${{ secrets.DO_APP_ID }}

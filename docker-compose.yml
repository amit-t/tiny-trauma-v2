services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt
      POSTGRES_DB: tinytrauma
    ports:
      - "5433:5432"
    volumes:
      - tt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt -d tinytrauma"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tt_pgdata:
